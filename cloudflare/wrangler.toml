name = "paz-site"
main = "worker.mjs"
compatibility_date = "2026-01-01"

# The pages the render-site Edge Function writes (public bucket `site`).
[vars]
SITE_BUCKET_URL = "https://eczmttndsbockxkklqoe.supabase.co/storage/v1/object/public/site"

# Answer paz.com.np through the Worker. Anything it does not have a page for
# goes straight on to the web host. Route patterns need the zone to be on this
# Cloudflare account, which it already is.
[[routes]]
pattern = "paz.com.np/*"
zone_name = "paz.com.np"

[[routes]]
pattern = "www.paz.com.np/*"
zone_name = "paz.com.np"
