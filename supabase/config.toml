project_id = "paz-os"

[api]
enabled = true
port = 54321
# Only the curated `api` schema (plus PostgREST's required `public`) is
# exposed to PostgREST. Every domain schema (identity, authz, publishing,
# programs, membership, crm, hospitality, admin, analytics) is reachable
# only through views/functions in `api`, through Edge Functions using the
# service role, or through direct database access for migrations/ops.
# (Architecture Blueprint §5.1; Build Readiness Review §3.1.)
schemas = ["public", "api"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
# Only reference data (roles/permissions) runs via `supabase db reset` /
# `supabase start`, in every environment including production. Synthetic
# fixture data (fake people/content for local development) lives in
# supabase/seed/synthetic.sql and is applied explicitly via
# `psql -f supabase/seed/synthetic.sql`, never automatically — see
# docs/runbooks/environments.md. This split is what makes it structurally
# impossible for a `supabase db reset` run against production to seed fake
# people into a real institution's database.
sql_paths = ["./seed/authz.sql"]

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

# Kept explicit so `supabase config push` never silently downgrades these to
# CLI defaults (it did once — caught in the push diff and restored).
[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/authz/custom_access_token_hook"

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true

# Public intake functions: called by anyone visiting the site, signed in
# or not, so verify_jwt only needs to see *a* valid JWT -- the anon key
# qualifies. authz/RLS, not this flag, is what limits what the call can
# actually do (the function forwards the caller's own Authorization
# header into the RPC it wraps -- see supabase/functions/request-reservation).
[functions.request-reservation]
verify_jwt = true

[functions.submit-membership-application]
verify_jwt = true

[functions.register-for-session]
verify_jwt = true

# Staff-only in practice (authz.has_staff_permission checked inside the RPC
# it wraps), but verify_jwt here still only means "a valid JWT" -- the
# anon key would pass this flag and then fail the permission check inside
# membership.decide_application, same layering as the public functions.
[functions.decide-membership-application]
verify_jwt = true

# Staff-only in practice (media_objects_insert_staff / publishing.media.create
# gate the storage write and the register_media RPC respectively), same
# verify_jwt-is-not-the-permission-check layering as above.
[functions.ingest-media]
verify_jwt = true

[functions.submit-contact-message]
verify_jwt = true

# Not a public-facing function at all -- verify_jwt only proves *a* valid
# JWT was presented (any anon/authenticated token would pass); the
# function body itself additionally requires the bearer token to equal
# SUPABASE_SERVICE_ROLE_KEY exactly. Called only by the scheduled job in
# .github/workflows/membership-renewal-notices.yml.
[functions.send-renewal-notices]
verify_jwt = true
